name: CI

# Continuous integration for Earnings Decision Lab: backend (ruff, mypy,
# pytest), frontend (ESLint, typecheck, build), and a full Docker Compose
# stack build + health check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: earnings_decision_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d earnings_decision_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:change_me@localhost:5432/earnings_decision_lab
      # backend/tests/conftest.py refuses to run against the application's own
      # database identity, so the tests get a SEPARATE database on this job's
      # disposable Postgres service (created in a step below).
      TEST_DATABASE_URL: postgresql+psycopg://postgres:change_me@localhost:5432/earnings_decision_lab_test
      SEC_EDGAR_USER_AGENT: "Earnings Decision Lab CI ci@example.com"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # `ibapi` is a local-path dependency on the OFFICIAL IBKR TWS API client,
      # fetched and SHA256-verified at build time (never committed, never PyPI --
      # see backend/vendor/ibapi_official/PROVENANCE.md). The Dockerfile does the
      # same; without it `uv sync` cannot resolve the project.
      - name: Fetch the official IBKR TWS API client
        working-directory: backend
        run: python3 scripts/fetch_ibapi_official.py

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check src tests

      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy src

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Create the isolated test database
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:change_me@localhost:5432/earnings_decision_lab", autocommit=True) as conn:
              conn.execute("CREATE DATABASE earnings_decision_lab_test")
          PY

      - name: Run tests
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A minimal, non-secret .env for docker-compose.yml's `env_file:`
      # directive, which requires the file to exist. Provider/LLM keys are
      # deliberately left empty — this job validates that the images build
      # and the stack wires together and starts healthy, the same "no real
      # LLM key in CI, by design" posture as the backend job above, not a
      # live-provider smoke test.
      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=ci
          LOG_LEVEL=INFO
          POSTGRES_HOST=db
          POSTGRES_PORT=5433
          POSTGRES_DB=earnings_decision_lab
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_only_not_a_real_secret
          SEC_EDGAR_USER_AGENT=Earnings Decision Lab CI ci@example.com
          TIINGO_API_KEY=
          ALPHA_VANTAGE_API_KEY=
          LLM_PROVIDER=deepseek
          DEEPSEEK_API_KEY=
          DEEPSEEK_BASE_URL=https://api.deepseek.com
          DEEPSEEK_MODEL=deepseek-v4-flash
          OPENAI_API_KEY=
          OPENAI_MODEL=
          ANTHROPIC_API_KEY=
          ANTHROPIC_MODEL=
          OPENAI_COMPATIBLE_API_KEY=
          OPENAI_COMPATIBLE_BASE_URL=
          OPENAI_COMPATIBLE_MODEL=
          EOF

      - name: Build images
        run: docker compose build migrate backend frontend

      - name: Start db and apply migrations
        run: |
          docker compose up -d db
          docker compose run --rm migrate

      - name: Start backend and frontend
        run: docker compose up -d backend frontend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Verify frontend serves the SPA shell
        run: |
          curl -sf http://localhost:5173/ | grep -qi "<div id=\"root\">"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
