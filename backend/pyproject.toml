[project]
name = "earnings-decision-lab-backend"
version = "0.1.0"
description = "AI-assisted earnings intelligence, options analytics, and historical event research — backend service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "pgvector>=0.3.6",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["src"]` alone (the original config here) does NOT flatten the
# src/ prefix the way it looks like it should -- it was only ever exercised
# via `pythonpath = ["src"]` in the pytest config above, never via an actual
# `uv build`/install, until Phase 10's Docker work tried to run the real
# installed package and every import of `models`, `api`, etc. failed with
# ModuleNotFoundError (the wheel shipped `src/agents/...`, `src/api/...`,
# not `agents/...`, `api/...`). Each top-level package under src/ has to be
# listed explicitly (hatchling has no "ship every directory under src/"
# option) so it installs at the wheel root, matching what every import
# statement in this codebase already assumes.
packages = [
    "src/agents",
    "src/analytics",
    "src/api",
    "src/core",
    "src/db",
    "src/evaluation",
    "src/ingestion",
    "src/models",
    "src/observability",
    "src/prompts",
    "src/providers",
    "src/rag",
    "src/schemas",
    "src/services",
]
