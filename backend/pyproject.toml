[project]
name = "earnings-decision-lab-backend"
version = "4.0.1"
description = "AI-assisted earnings intelligence, options analytics, and historical event research — backend service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "pgvector>=0.3.6",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "cryptography>=43.0",
    # IBKR TWS Migration Phase 1.1 -- the REAL official Interactive
    # Brokers TWS API Python client (EClient/EWrapper), version 10.45.01,
    # resolved via [tool.uv.sources] below to a local path fetched and
    # SHA256-verified by scripts/fetch_ibapi_official.py -- never PyPI.
    # Phase 1 originally depended on PyPI's `ibapi==9.81.1.post1` and
    # called it "official"; that was wrong (third-party-published,
    # 9 minor versions stale) -- see vendor/ibapi_official/PROVENANCE.md
    # for the full correction record and why this is a local path
    # dependency rather than a vendored/committed one (this repo is
    # public; the IB API Non-Commercial License prohibits redistribution).
    "ibapi",
    # A real, new transitive dependency of the official 10.45 client's
    # own setup.py (`install_requires=["protobuf==5.29.5"]`) -- the old
    # 9.81 PyPI package had no such requirement. Pinned to match exactly.
    "protobuf==5.29.5",
]

[tool.uv.sources]
ibapi = { path = "vendor/ibapi_official/pythonclient" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["src"]` alone (the original config here) does NOT flatten the
# src/ prefix the way it looks like it should -- it was only ever exercised
# via `pythonpath = ["src"]` in the pytest config above, never via an actual
# `uv build`/install, until Phase 10's Docker work tried to run the real
# installed package and every import of `models`, `api`, etc. failed with
# ModuleNotFoundError (the wheel shipped `src/agents/...`, `src/api/...`,
# not `agents/...`, `api/...`). Each top-level package under src/ has to be
# listed explicitly (hatchling has no "ship every directory under src/"
# option) so it installs at the wheel root, matching what every import
# statement in this codebase already assumes.
packages = [
    "src/agents",
    "src/analytics",
    "src/api",
    "src/core",
    "src/db",
    "src/evaluation",
    "src/ingestion",
    "src/models",
    "src/observability",
    "src/prompts",
    "src/providers",
    "src/rag",
    "src/schemas",
    "src/services",
    "src/workers",
]
