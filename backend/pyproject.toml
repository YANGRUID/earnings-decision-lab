[project]
name = "earnings-decision-lab-backend"
version = "4.1.0"
description = "AI-assisted earnings intelligence, options analytics, and historical event research — backend service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "pgvector>=0.3.6",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "cryptography>=43.0",
    # IBKR TWS Migration Phase 1.1 -- the REAL official Interactive
    # Brokers TWS API Python client (EClient/EWrapper), version 10.45.01,
    # resolved via [tool.uv.sources] below to a local path fetched and
    # SHA256-verified by scripts/fetch_ibapi_official.py -- never PyPI.
    # Phase 1 originally depended on PyPI's `ibapi==9.81.1.post1` and
    # called it "official"; that was wrong (third-party-published,
    # 9 minor versions stale) -- see vendor/ibapi_official/PROVENANCE.md
    # for the full correction record and why this is a local path
    # dependency rather than a vendored/committed one (this repo is
    # public; the IB API Non-Commercial License prohibits redistribution).
    "ibapi",
    # A real, new transitive dependency of the official 10.45 client's
    # own setup.py (`install_requires=["protobuf==5.29.5"]`) -- the old
    # 9.81 PyPI package had no such requirement. Pinned to match exactly.
    "protobuf==5.29.5",
    # Agentic research runtime (Phase LG-0/LG-1, 2026-10-01). Deliberately
    # THREE packages, not the `langchain` meta-package: this project keeps
    # its own LLMProvider abstraction, its own SEC-aware RAG stack and its
    # own deterministic financial engine, so none of the community
    # loaders/splitters/vector-store adapters are wanted. What is wanted is
    # langchain-core's Runnable/BaseChatModel/StructuredTool protocols (so
    # our adapters are real LangChain citizens) and LangGraph's state
    # machine, conditional routing and checkpointing.
    #
    # Majors are declared as installed, not optimistically low: langchain-core
    # 1.x and langgraph 1.x are the post-0.x API, and a resolver that picked
    # 0.3/0.2 here would hand us a different Runnable contract than the one
    # src/agents/graph/ is written against.
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    # Postgres checkpointer (requirement 37): this stack already runs
    # Postgres and already depends on psycopg[binary]; a Redis checkpointer
    # would add an operational dependency for no capability we need. Adds
    # psycopg-pool as its only new transitive runtime requirement.
    "langgraph-checkpoint-postgres>=3.1,<4",
]

[tool.uv.sources]
ibapi = { path = "vendor/ibapi_official/pythonclient" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["src"]` alone (the original config here) does NOT flatten the
# src/ prefix the way it looks like it should -- it was only ever exercised
# via `pythonpath = ["src"]` in the pytest config above, never via an actual
# `uv build`/install, until Phase 10's Docker work tried to run the real
# installed package and every import of `models`, `api`, etc. failed with
# ModuleNotFoundError (the wheel shipped `src/agents/...`, `src/api/...`,
# not `agents/...`, `api/...`). Each top-level package under src/ has to be
# listed explicitly (hatchling has no "ship every directory under src/"
# option) so it installs at the wheel root, matching what every import
# statement in this codebase already assumes.
packages = [
    "src/agents",
    "src/analytics",
    "src/api",
    "src/core",
    "src/db",
    "src/evaluation",
    "src/ingestion",
    "src/models",
    "src/observability",
    "src/prompts",
    "src/providers",
    "src/rag",
    "src/schemas",
    "src/services",
    "src/workers",
]
