services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-earnings_decision_lab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      # Host port 5433 to avoid clashing with a default local Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-earnings_decision_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and exits. `backend` waits for this to
  # *complete successfully* (not just for `db` to be healthy) so the API
  # never starts against a schema that isn't there yet.
  migrate:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-earnings_decision_lab}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-earnings_decision_lab}
    # host.docker.internal resolves natively on Docker Desktop (Mac/Windows);
    # this extra_hosts entry is what makes it also resolve on Linux Docker,
    # so IBKR_BASE_URL=https://host.docker.internal:5001/... (see
    # .env.example) reaches a Gateway running on the host from inside the
    # container on every supported platform -- previously undocumented as a
    # deliberately deferred gap (see docs/ibkr_integration.md), now fixed.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost -- wget resolves "localhost" to ::1 first
      # inside this container, and nginx doesn't listen on IPv6, so the
      # healthcheck reported "unhealthy" (connection refused) even while
      # correctly serving real traffic on IPv4. Confirmed live in Phase 12
      # Docker verification.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  db_data:
