<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earnings Decision Lab</title>
    <!-- Brand mark on a white background is the default everywhere (docs/brand/BRAND.md). -->
    <link rel="icon" type="image/svg+xml" href="/brand/EDL-logo-light.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/EDL-logo-white-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/EDL-logo-white-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/EDL-logo-white-180.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Applied before first paint so an explicit light/dark choice (see
      // hooks/useTheme.ts) never flashes the system-preference theme first.
      (function () {
        try {
          var stored = localStorage.getItem("ecl-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          // localStorage unavailable (e.g. private browsing) -- fall back
          // to the system prefers-color-scheme media query untouched.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
