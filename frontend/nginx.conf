# React Router uses client-side routing — any path that isn't a real static
# file (e.g. /company/NVDA) must still serve index.html so the SPA's router
# can take over, rather than nginx returning a 404 for a route that only
# exists client-side.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
